<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中數學歷屆試題數據儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-blue-600 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">📐 國中數學歷屆試題數據分析系統</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">民國 111 年 ～ 115 年</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 space-y-6">

        <section class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-4 gap-3">
                <div>
                    <h2 class="text-lg font-bold text-gray-900">📊 單屆試題分布圖表</h2>
                    <p class="text-xs text-gray-500">選擇特定屆別，可以看出各題在各單元的分布比例</p>
                </div>
                <select id="yearSelect" class="border border-gray-300 rounded-lg p-2 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="115">民國 115 年會考</option>
                    <option value="114" disabled>民國 114 年會考 (日後擴充)</option>
                    <option value="113" disabled>民國 113 年會考 (日後擴充)</option>
                    <option value="112" disabled>民國 112 年會考 (日後擴充)</option>
                    <option value="111" disabled>民國 111 年會考 (日後擴充)</option>
                </select>
            </div>
            <div class="w-full max-w-md mx-auto h-64 flex justify-center items-center">
                <canvas id="distributionChart"></canvas>
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-4 gap-3">
                <div>
                    <h2 class="text-lg font-bold text-gray-900">📈 歷年出題趨勢折線圖</h2>
                    <p class="text-xs text-gray-500">展示各歷屆在各單元的出題比重與趨勢變化</p>
                </div>
                <select id="trendUnitSelect" class="border border-gray-300 rounded-lg p-2 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </select>
            </div>
            <div class="w-full h-64">
                <canvas id="trendChart"></canvas>
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="border-b border-gray-200 pb-3 mb-4">
                <h2 class="text-lg font-bold text-gray-900">🔍 單元與主題歷屆題目檢視</h2>
                <p class="text-xs text-gray-500">選擇特定單元主題，即刻撈出 111-115 出了哪些試題圖檔</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">選擇學期</label>
                    <select id="semesterFilter" class="w-full border border-gray-300 rounded-lg p-2 bg-white text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">選擇單元（章）</label>
                    <select id="unitFilter" class="w-full border border-gray-300 rounded-lg p-2 bg-white text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">選擇主題（幾之幾）</label>
                    <select id="themeFilter" class="w-full border border-gray-300 rounded-lg p-2 bg-white text-sm"></select>
                </div>
            </div>

            <div id="questionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
        </section>
    </main>

    <script>
        // 1. 課綱地圖原始事實資料庫 (對齊您提供的官方名稱事實)
        const curriculumMap = {
            "七年級上學期": {
                "第一章 整數運算與科學記號": ["1-1 數與數線", "1-2 整數的加減運算", "1-3 整數的乘除運算", "1-4 指數記法與科學記號"],
                "第二章 因數分解與分數運算": ["2-1 質因數分解", "2-2 公因數與公倍數", "2-3 分數的四則運算", "2-4 指數律"],
                "第三章 一元一次方程式": ["3-1 以符號列式與運算", "3-2 一元一次方程式的列式與求解", "3-3 一元一次方程式的應用"]
            },
            "七年級下學期": {
                "第一章 二元一次聯立方程式": ["1-1 二元一次方程式", "1-2 解二元一次聯立方程式", "1-3 二元一次聯立方程式的應用"],
                "第二章 平面直角坐標系": ["2-1 直角坐標平面", "2-2 二元一次方程式的圖形"],
                "第三章 比例": ["3-1 比例式", "3-2 正比與反比"],
                "第四章 一元一次不等式": ["4-1 一元一次不等式及其解", "4-2 解一元一次不等式及其應用"],
                "第五章 統計圖表與資料分析": ["5-1 統計圖表與平均數、中位數、眾數"],
                "第六章 生活中的幾何圖形": ["6-1 幾何圖形、線對稱與三視圖"]
            },
            "八年級上學期": {
                "第一章 乘法公式與多項式": ["1-1 乘法公式", "1-2 多項式的加法與減法", "1-3 多項式的乘法與除法"],
                "第二章 平方根與畢氏定理": ["2-1 平方根與近似值", "2-2 根式的運算", "2-3 畢氏定理"],
                "第三章 因式分解": ["3-1 提公因式法與乘法公式因式分解", "3-2 利用十字交乘法因式分解"],
                "第四章 一元二次方程式": ["4-1 因式分解法解一元二次方程式", "4-2 配方法與一元二次方程式的公式解", "4-3 一元二次方程式的應用"],
                "第五章 統計資料處理與圖表": ["5-1 相對與累積次數分配圖表"]
            },
            "八年級下學期": {
                "第一章 數列與等差級數": ["1-1 等差數列", "1-2 等差級數", "1-3 等比數列"],
                "第二章 函數及其圖形": ["2-1 一次函數與函數圖形"],
                "第三章 三角形的性質與尺規作圖": ["3-1 內角與外角", "3-2 基本尺規作圖", "3-3 三角形全等與應用", "3-4 三角形的邊角關係"],
                "第四章 平行與四邊形": ["4-1 平行線與截角性質", "4-2 平行四邊形", "4-3 特殊的四邊形與梯形"]
            },
            "九年級上學期": {
                "第一章 比例線段與相似形": ["1-1 連比", "1-2 比例線段", "1-3 相似形"],
                "第二章 圓的性質": ["2-1 圓形及點、直線、圓之間的關係", "2-2 弧與圓周角"],
                "第三章 推理證明與三角形的心": ["3-1 推理與證明", "3-2 三角形的外心、內心與重心"]
            },
            "九年級下學期": {
                "第一章 二次函數": ["1-1 二次函數及其圖形", "1-2 二次函數的最大值或最小值"],
                "第二章 統計與機率": ["2-1 統計數據的分布（四分位數與盒狀圖）", "2-2 機率"],
                "第三章 立體幾何圖形": ["3-1 柱體、錐體與空間概念"]
            }
        };

        // 2. 115年度黃金標準題庫資料庫 (含效果 5 複合知識節點)
        const examDatabase = [
            { id: "115_01", year: 115, num: "選擇 1", unit: "第一章 二元一次聯立方程式", theme: "1-2 解二元一次聯立方程式", nodes: ["1-2 解二元一次聯立方程式"] },
            { id: "115_02", year: 115, num: "選擇 2", unit: "第三章 立體幾何圖形", theme: "3-1 柱體、錐體與空間概念", nodes: ["3-1 柱體、錐體與空間概念"] },
            { id: "115_03", year: 115, num: "選擇 3", unit: "第二章 平方根與畢氏定理", theme: "2-2 根式的運算", nodes: ["2-2 根式的運算"] },
            { id: "115_04", year: 115, num: "選擇 4", unit: "第二章 統計與機率", theme: "2-2 機率", nodes: ["2-2 機率"] },
            { id: "115_05", year: 115, num: "選擇 5", unit: "第二章 因數分解與分數運算", theme: "2-3 分數的四則運算", nodes: ["2-3 分數的四則運算"] },
            { id: "115_06", year: 115, num: "選擇 6", unit: "第五章 統計圖表與資料分析", theme: "5-1 統計圖表與平均數、中位數、眾數", nodes: ["5-1 統計圖表與平均數、中位數、眾數"] },
            { id: "115_07", year: 115, num: "選擇 7", unit: "第一章 乘法公式與多項式", theme: "1-3 多項式的乘法與除法", nodes: ["1-3 多項式的乘法與除法"] },
            { id: "115_08", year: 115, num: "選擇 8", unit: "第一章 整數運算與科學記號", theme: "1-4 指數記法與科學記號", nodes: ["1-4 指數記法與科學記號"] },
            { id: "115_09", year: 115, num: "選擇 9", unit: "第四章 一元二次方程式", theme: "4-1 因式分解法解一元二次方程式", nodes: ["4-1 因式分解法解一元二次方程式"] },
            { id: "115_10", year: 115, num: "選擇 10", unit: "第三章 比例", theme: "3-1 比例式", nodes: ["3-1 比例式"] },
            { id: "115_11", year: 115, num: "選擇 11", unit: "第一章 整數運算與科學記號", theme: "1-2 整數的加減運算", nodes: ["1-2 整數的加減運算"] },
            { id: "115_12", year: 115, num: "選擇 12", unit: "第三章 三角形的性質與尺規作圖", theme: "3-3 三角形全等與應用", nodes: ["3-3 三角形全等與應用"] },
            { id: "115_13", year: 115, num: "選擇 13", unit: "第二章 平面直角坐標系", theme: "2-2 二元一次方程式的圖形", nodes: ["2-2 二元一次方程式的圖形"] },
            { id: "115_14", year: 115, num: "選擇 14", unit: "第一章 二次函數", theme: "1-1 二次函數及其圖形", nodes: ["1-1 二次函數及其圖形", "1-2 二次函數的最大值或最小值"] },
            { id: "115_15", year: 115, num: "選擇 15", unit: "第三章 三角形的性質與尺規作圖", theme: "3-1 內角與外角", nodes: ["3-1 內角與外角"] },
            { id: "115_16", year: 115, num: "選擇 16", unit: "第三章 推理證明與三角形的心", theme: "3-2 三角形的外心、內心與重心", nodes: ["3-2 三角形的外心、內心與重心"] },
            { id: "115_17", year: 115, num: "選擇 17", unit: "第一章 整數運算與科學記號", theme: "1-4 指數記法與科學記號", nodes: ["1-4 指數記法與科學記號"] },
            { id: "115_18", year: 115, num: "選擇 18", unit: "第四章 平行與四邊形", theme: "4-3 特殊的四邊形與梯形", nodes: ["4-3 特殊的四邊形與梯形", "2-3 畢氏定理", "2-1 圓形及點、直線、圓之間的關係"] },
            { id: "115_19", year: 115, num: "選擇 19", unit: "第二章 圓的性質", theme: "2-2 弧與圓周角", nodes: ["2-2 弧與圓周角"] },
            { id: "115_20", year: 115, num: "選擇 20", unit: "第二章 因數分解與分數運算", theme: "2-1 質因數分解", nodes: ["2-1 質因數分解"] },
            { id: "115_21", year: 115, num: "選擇 21", unit: "第一章 比例線段與相似形", theme: "1-3 相似形", nodes: ["1-3 相似形", "1-2 比例線段"] },
            { id: "115_22", year: 115, num: "選擇 22", unit: "第四章 平行與四邊形", theme: "4-2 平行四邊形", nodes: ["4-2 平行四邊形", "3-3 三角形全等與應用"] },
            { id: "115_23", year: 115, num: "選擇 23 (題組)", unit: "第三章 比例", theme: "3-2 正比與反比", nodes: ["3-2 正比與反比"] },
            { id: "115_24", year: 115, num: "選擇 24 (題組)", unit: "第三章 一元一次方程式", theme: "3-2 一元一次方程式的列式與求解", nodes: ["3-2 一元一次方程式的列式與求解"] },
            { id: "115_25", year: 115, num: "選擇 25 (題組)", unit: "第四章 一元一次不等式", theme: "4-1 一元一次不等式及其解", nodes: ["4-1 一元一次不等式及其解"] },
            { id: "115_non_01", year: 115, num: "非選 1", unit: "第一章 數列與等差級數", theme: "1-1 等差數列", nodes: ["1-1 等差數列"] },
            { id: "115_non_02_1", year: 115, num: "非選 2(1)", unit: "第三章 三角形的性質與尺規作圖", theme: "3-1 內角與外角", nodes: ["3-1 內角與外角"] },
            { id: "115_non_02_2", year: 115, num: "非選 2(2)", unit: "第三章 三角形的性質與尺規作圖", theme: "3-1 內角與外角", nodes: ["3-1 內角與外角", "2-3 畢氏定理"] }
        ];

        // 3. 初始化圖表變數
        let distChart, trendChart;

        window.addEventListener('DOMContentLoaded', () => {
            initFilters();
            renderDistributionChart("115");
            renderTrendChart();
            updateQuestionGrid();
        });

        // 4. 三級下拉選單動態綁定邏輯
        function initFilters() {
            const semSelect = document.getElementById('semesterFilter');
            const unitSelect = document.getElementById('unitFilter');
            const themeSelect = document.getElementById('themeFilter');
            const trendUnitSelect = document.getElementById('trendUnitSelect');

            // 填入學期
            Object.keys(curriculumMap).forEach(sem => {
                semSelect.innerHTML += `<option value="${sem}">${sem}</option>`;
            });

            // 順便把所有單元塞進趨勢圖選單
            Object.keys(curriculumMap).forEach(sem => {
                Object.keys(curriculumMap[sem]).forEach(unit => {
                    trendUnitSelect.innerHTML += `<option value="${unit}">${unit}</option>`;
                });
            });

            function updateUnits() {
                const sem = semSelect.value;
                unitSelect.innerHTML = '';
                Object.keys(curriculumMap[sem]).forEach(unit => {
                    unitSelect.innerHTML += `<option value="${unit}">${unit}</option>`;
                });
                updateThemes();
            }

            function updateThemes() {
                const sem = semSelect.value;
                const unit = unitSelect.value;
                themeSelect.innerHTML = '';
                curriculumMap[sem][unit].forEach(theme => {
                    themeSelect.innerHTML += `<option value="${theme}">${theme}</option>`;
                });
                updateQuestionGrid();
            }

            semSelect.addEventListener('change', updateUnits);
            unitSelect.addEventListener('change', updateThemes);
            themeSelect.addEventListener('change', updateQuestionGrid);
            trendUnitSelect.addEventListener('change', renderTrendChart);

            updateUnits();
        }

        // 5. 渲染效果 2 - 單屆分布圓餅圖
        function renderDistributionChart(year) {
            const ctx = document.getElementById('distributionChart').getContext('2d');
            const filtered = examDatabase.filter(q => q.year == year);
            
            const counts = {};
            filtered.forEach(q => {
                counts[q.unit] = (counts[q.unit] || 0) + 1;
            });

            if (distChart) distChart.destroy();

            distChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(counts),
                    datasets: [{
                        data: Object.values(counts),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6366f1', '#14b8a6']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } }
                }
            });
        }

        // 6. 渲染效果 6 - 歷年出題趨勢折線圖
        function renderTrendChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const targetUnit = document.getElementById('trendUnitSelect').value;
            
            // X 軸固定為近 5 年時間軸
            const years = ['111', '112', '113', '114', '115'];
            
            // 目前僅 115 有數據，其餘年份預設為 0 (留待日後往前搜集擴充)
            const dataPoints = years.map(y => {
                if (y === '115') {
                    return examDatabase.filter(q => q.year == 115 && q.unit === targetUnit).length;
                }
                return 0; 
            });

            if (trendChart) trendChart.destroy();

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years.map(y => `民國 ${y} 年`),
                    datasets: [{
                        label: `${targetUnit} 出題數量趨勢`,
                        data: dataPoints,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        borderWidth: 3,
                        tension: 0.2,
                        fill: true,
                        pointRadius: 5,
                        pointBackgroundColor: '#2563eb'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        // 7. 渲染效果 3 & 5 - 依照主題篩選出歷屆題目與知識節點
        function updateQuestionGrid() {
            const targetTheme = document.getElementById('themeFilter').value;
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            // 核心邏輯：只要複合標籤 nodes 包含此主題，就判定過關！
            const matchedQuestions = examDatabase.filter(q => q.nodes.includes(targetTheme));

            if (matchedQuestions.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-gray-400 text-sm">⚠️ 民國 111-115 年此主題尚無試題數據，或留待往前搜集。</div>`;
                return;
            }

            matchedQuestions.forEach(q => {
                // 渲染細部知識節點標籤
                const tagsHtml = q.nodes.map(node => 
                    `<span class="bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded border border-blue-100 font-medium">🏷️ ${node}</span>`
                ).join(' ');

                const card = `
                    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-xs hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-center mb-3">
                            <span class="bg-gray-100 text-gray-700 font-bold text-xs px-2.5 py-1 rounded-md">${q.year}年會考 - ${q.num}</span>
                            <span class="text-xs text-gray-400">ID: ${q.id}</span>
                        </div>
                        
                        <div class="bg-gray-100 rounded-lg h-40 flex items-center justify-center border border-dashed border-gray-300 text-gray-400 text-sm font-mono mb-4 overflow-hidden">
                            [ 試題 PNG 圖片區塊 ]<br>
                            images/${q.year}/${q.id}.png
                        </div>

                        <div>
                            <p class="text-xs font-semibold text-gray-500 mb-1.5">🧠 包含知識節點：</p>
                            <div class="flex flex-wrap gap-1.5">
                                ${tagsHtml}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }
    </script>
</body>
</html>
