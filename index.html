<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>國中數學歷屆試題統計數據</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body{font-family:"Noto Sans TC",system-ui,sans-serif}.scrollbar::-webkit-scrollbar{width:8px}.scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
    .drawer{transition:transform .25s ease}.drawer.closed{transform:translateX(-100%)}.accordion-body{display:none}.accordion.open .accordion-body{display:block}
  </style>
</head>
<body class="h-screen overflow-hidden bg-slate-50 text-slate-800">
<header class="h-14 bg-slate-900 px-5 text-white flex items-center justify-between shadow"><h1 class="font-bold tracking-wide">國中數學歷屆試題統計數據</h1><button id="openAdmin" class="rounded bg-slate-700 px-3 py-1.5 text-sm hover:bg-slate-600">⚙️ 管理後台</button></header>

<aside id="drawer" class="drawer closed fixed inset-y-0 left-0 z-50 flex w-[22rem] flex-col bg-slate-800 text-white shadow-2xl">
  <div class="flex items-center justify-between border-b border-slate-700 p-4"><h2 class="font-bold">⚙️ 管理後台</h2><button id="closeAdmin" class="text-xl text-slate-300 hover:text-white">✕</button></div>
  <section id="loginPanel" class="m-auto w-full max-w-xs space-y-3 p-6"><p class="text-center text-sm text-slate-300">請輸入管理者密碼以解鎖設定</p><input id="password" type="password" placeholder="管理者密碼" class="w-full rounded border border-slate-600 bg-slate-700 p-2 text-sm"><button id="login" class="w-full rounded bg-blue-600 py-2 text-sm font-medium hover:bg-blue-500">登入後台</button></section>
  <section id="adminPanel" class="hidden flex-1 overflow-y-auto p-4 space-y-4 scrollbar">
    <div class="rounded border border-slate-600 bg-slate-700/50 p-3"><h3 class="mb-2 text-sm font-bold">新增年度試題</h3><div class="flex gap-2"><input id="newYear" inputmode="numeric" placeholder="例如：114" class="min-w-0 flex-1 rounded bg-slate-800 p-2 text-sm"><button id="addYear" class="rounded bg-blue-600 px-3 text-sm">新增</button></div><p class="mt-2 text-xs text-slate-400">先新增年度，再匯入該年度 Excel 對照表與圖片。</p></div>
    <div class="rounded border border-slate-600 bg-slate-700/50 p-3"><h3 class="mb-2 text-sm font-bold">📊 匯入 Excel 對照表</h3><label id="excelDrop" class="block cursor-pointer rounded border-2 border-dashed border-slate-500 p-4 text-center text-xs hover:bg-slate-700">點擊或拖曳 .xlsx / .xls / .csv 檔案<input id="excelFile" type="file" accept=".xlsx,.xls,.csv" class="hidden"></label><p id="excelMessage" class="mt-2 text-xs text-emerald-300"></p></div>
    <div class="rounded border border-slate-600 bg-slate-700/50 p-3"><h3 class="text-sm font-bold">🖼️ 批次試題圖片上傳</h3><select id="uploadYear" class="mt-2 w-full rounded bg-slate-800 p-2 text-sm"></select><label id="imageDrop" class="mt-2 block cursor-pointer rounded border-2 border-dashed border-amber-400 p-4 text-center text-xs text-amber-200 hover:bg-slate-700">點擊或拖曳多張圖片<input id="imageFile" type="file" accept="image/*" multiple class="hidden"></label><p id="uploadMessage" class="mt-2 text-xs text-emerald-300"></p></div>
    <div class="rounded border border-slate-600 bg-slate-700/50 p-3"><div class="mb-2 flex items-center justify-between"><h3 class="text-sm font-bold">📋 對照管理清單</h3><select id="manageYear" class="rounded bg-slate-800 p-1 text-xs"></select></div><button id="clearYearImages" class="mb-2 w-full rounded bg-rose-700 py-1.5 text-xs hover:bg-rose-600">一鍵清除本年度所有圖片</button><div id="adminList" class="space-y-2"></div></div>
  </section>
  <button id="logout" class="hidden m-4 mt-0 rounded border border-slate-600 py-2 text-sm text-slate-200 hover:bg-slate-700">登出</button>
</aside>

<main class="mx-auto grid h-[calc(100vh-3.5rem)] max-w-[1600px] grid-cols-[22rem_minmax(0,1fr)] gap-4 p-4">
  <aside class="flex min-h-0 flex-col gap-3"><div class="rounded-xl border bg-white p-3 shadow-sm"><label class="text-xs font-bold text-slate-500">📅 會考年度</label><select id="yearFilter" class="mt-1 w-full rounded border p-2 text-sm"></select><div id="semesterTabs" class="mt-2 flex flex-wrap gap-1"></div><input id="search" placeholder="搜尋單元、主題或編號" class="mt-2 w-full rounded border p-2 text-sm"></div><div class="min-h-0 flex-1 rounded-xl border bg-white p-3 shadow-sm"><div class="mb-2 flex justify-between border-b pb-2"><b class="text-sm">課綱單元與主題</b><button id="collapseAll" class="text-xs text-blue-600">全部收合</button></div><div id="unitTree" class="h-full overflow-y-auto pr-1 scrollbar"></div></div></aside>
  <section class="grid min-h-0 grid-rows-[15rem_minmax(0,1fr)] gap-3"><div class="rounded-xl border bg-white p-3 shadow-sm"><div class="flex items-start justify-between border-b pb-2"><div><b class="text-sm">🗂️ 試題對照選單</b><p id="scope" class="mt-1 text-xs text-blue-700">請從左側選擇單元或主題</p></div><span id="count" class="rounded-full bg-blue-50 px-2 py-1 text-xs font-bold text-blue-700">0 題</span></div><div id="questionList" class="mt-2 h-[10.5rem] overflow-y-auto pr-1 scrollbar"></div></div><div class="min-h-0 rounded-xl border bg-white p-4 shadow-sm"><div class="flex justify-between border-b pb-2"><div><h2 id="detailTitle" class="font-bold text-blue-900">尚未選取試題</h2><p id="detailPath" class="mt-1 text-xs text-slate-500">請由上方清單選取題目</p></div></div><div id="preview" class="mt-3 flex h-[calc(100%-4rem)] min-h-0 items-start justify-center overflow-y-auto rounded-lg border bg-slate-50 p-3 scrollbar"><p class="m-auto text-center text-sm text-slate-400">🖼️<br>尚未選取試題</p></div></div></section>
</main>

<input id="replaceImage" type="file" accept="image/*" class="hidden">
<script>
const DB_NAME='math_exam_dashboard', STORE='state', KEY='dashboard-state';
const defaultRows=[
 {id:'115-1',year:'115',num:'第1題',unit:'第一章 整數運算與科學記號',theme:'1-2 整數的加減運算',expectedImgName:'1',order:1},
 {id:'115-group-23',year:'115',num:'題組背景引文',unit:'第二章 統計與機率',theme:'2-2 機率',expectedImgName:'題組文章',groupId:'115-g23',isGroup:true,order:23},
 {id:'115-23',year:'115',num:'第23題',unit:'第二章 統計與機率',theme:'2-2 機率',expectedImgName:'23',groupId:'115-g23',order:24},
 {id:'115-24',year:'115',num:'第24題',unit:'第二章 統計與機率',theme:'2-2 機率',expectedImgName:'24',groupId:'115-g23',order:25}
];
let state={years:['115'],rows:defaultRows}, filter={year:'115',semester:'全部',query:'',unit:null,theme:null}, selected=null, adminUnlocked=false, replaceTarget=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function load(){try{const d=await db();const v=await new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).get(KEY);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});if(v?.rows){state=v}else{const legacy=localStorage.getItem('math_exam_db_v4'),legacyYears=localStorage.getItem('math_managed_years_v4');if(legacy){const old=JSON.parse(legacy);state={years:legacyYears?JSON.parse(legacyYears):['115'],rows:old.map((r,i)=>({...r,id:r.id||`${r.year}-${r.num}-${i}`,order:r.excelRowIndex||i+1,image:r.image||r.imageBase64||'',imageName:r.imageName||'',isGroup:r.num==='題組'||/題組背景|共同引文/.test(r.num),groupId:r.belongsToGroupId||r.groupId||undefined}))};await new Promise((ok,no)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(state,KEY);r.onsuccess=ok;r.onerror=()=>no(r.error)})}}d.close()}catch(e){console.warn(e)}}
async function save(){const d=await db();await new Promise((ok,no)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(state,KEY);r.onsuccess=ok;r.onerror=()=>no(r.error)});d.close()}
function allYears(){return [...new Set([...state.years,...state.rows.map(r=>r.year)])].sort((a,b)=>Number(b)-Number(a))}
function init(){renderSelectors();renderTree();renderQuestions();}
function renderSelectors(){const ys=allYears();$('yearFilter').innerHTML='<option value="all">顯示全部年度</option>'+ys.map(y=>`<option value="${esc(y)}">${esc(y)} 年度</option>`).join('');$('yearFilter').value=filter.year;for(const id of ['uploadYear','manageYear']){$(id).innerHTML=ys.map(y=>`<option value="${esc(y)}">${esc(y)} 年度</option>`).join('')};$('semesterTabs').innerHTML=['全部','七上','七下','八上','八下','九上','九下'].map(x=>`<button data-sem="${x}" class="sem rounded px-2 py-1 text-xs ${filter.semester===x?'bg-blue-600 text-white':'bg-slate-100'}">${x}</button>`).join('');document.querySelectorAll('.sem').forEach(b=>b.onclick=()=>{filter.semester=b.dataset.sem;renderTree()})}
function inSem(r){return filter.semester==='全部'||r.semester===filter.semester}
function pool(){return state.rows.filter(r=>(filter.year==='all'||r.year===filter.year)&&inSem(r)&&(!filter.unit||r.unit===filter.unit)&&(!filter.theme||r.theme===filter.theme)&&(!filter.query||[r.unit,r.theme,r.num,r.year].join(' ').toLowerCase().includes(filter.query)))}
function renderTree(){const base=state.rows.filter(r=>(filter.year==='all'||r.year===filter.year)&&inSem(r)&&(!filter.query||[r.unit,r.theme].join(' ').toLowerCase().includes(filter.query)));const units=[...new Set(base.filter(r=>r.unit).map(r=>r.unit))];$('unitTree').innerHTML=units.length?units.map(u=>{const rs=base.filter(r=>r.unit===u),themes=[...new Set(rs.map(r=>r.theme).filter(Boolean))],cnt=rs.filter(r=>!r.isGroup).length;return `<div class="accordion mb-2 rounded border" data-unit="${esc(u)}"><button class="unitHead flex w-full items-center justify-between p-2 text-left hover:bg-slate-50"><span class="text-sm font-medium">${esc(u)}</span><span class="rounded bg-blue-50 px-1.5 text-xs text-blue-700">${cnt} 題</span></button><div class="accordion-body border-t bg-slate-50 p-1">${themes.map(t=>`<button data-theme="${esc(t)}" class="theme flex w-full justify-between rounded p-2 text-left text-xs hover:bg-blue-100"><span>${esc(t)}</span><span>${rs.filter(r=>r.theme===t&&!r.isGroup).length} 題</span></button>`).join('')}</div></div>`}).join(''):'<p class="py-6 text-center text-sm text-slate-400">沒有符合的課綱項目</p>';
 document.querySelectorAll('.unitHead').forEach(b=>b.onclick=()=>{const card=b.closest('.accordion');card.classList.toggle('open');filter.unit=card.dataset.unit;filter.theme=null;renderQuestions()});document.querySelectorAll('.theme').forEach(b=>b.onclick=e=>{e.stopPropagation();filter.theme=b.dataset.theme;filter.unit=b.closest('.accordion').dataset.unit;renderQuestions()})}
function status(r){return r.image?'bg-emerald-500':r.expectedImgName?'bg-amber-400':'bg-slate-300'}
function renderQuestions(){let rows=pool().sort((a,b)=>a.order-b.order);const grouped=filter.year==='all';$('scope').textContent=filter.unit?`範圍：${filter.year==='all'?'全部年度':filter.year+'年度'} ➔ ${filter.theme||filter.unit}`:'請從左側選擇單元或主題';$('count').textContent=`${rows.filter(r=>!r.isGroup).length} 題`;if(!filter.unit){$('questionList').innerHTML='<p class="py-8 text-center text-sm text-slate-400">選擇左側單元或主題後顯示試題</p>';showDetail(null);return}let html='';if(grouped){for(const y of allYears()){const x=rows.filter(r=>r.year===y);if(x.length)html+=`<details class="mb-2 rounded border" open><summary class="cursor-pointer bg-slate-50 p-2 text-xs font-bold">${y} 年度（${x.filter(r=>!r.isGroup).length} 題）</summary>${cards(x)}</details>`}}else html=cards(rows);$('questionList').innerHTML=html||'<p class="py-8 text-center text-sm text-slate-400">此範圍尚無題目</p>';document.querySelectorAll('.qcard').forEach(b=>b.onclick=()=>showDetail(state.rows.find(r=>r.id===b.dataset.id)));const first=document.querySelector('.qcard');if(first)first.click();else showDetail(null)}
function cards(rows){return rows.map(r=>`<button data-id="${esc(r.id)}" class="qcard my-1 flex w-full items-center justify-between rounded border p-2 text-left text-xs hover:border-blue-500"><span class="flex items-center gap-2"><i class="h-2 w-2 rounded-full ${status(r)}"></i><b>${esc(r.num)}</b></span><span class="text-slate-400">${esc(r.year)} 年度</span></button>`).join('')}
function showDetail(r){selected=r;if(!r){$('detailTitle').textContent='尚未選取試題';$('detailPath').textContent='請由上方清單選取題目';$('preview').innerHTML='<p class="m-auto text-center text-sm text-slate-400">🖼️<br>尚未選取試題</p>';return}$('detailTitle').textContent=`${r.year} 年度・${r.num}`;$('detailPath').textContent=`${r.unit||'未分類'}${r.theme?' ➔ '+r.theme:''}`;let imgs=[];if(r.groupId&&!r.isGroup){const stem=state.rows.find(x=>x.groupId===r.groupId&&x.isGroup);if(stem)imgs.push(imageView(stem,'題組背景引文'))}imgs.push(imageView(r,r.num));$('preview').innerHTML=imgs.join('')}
function imageView(r,label){return `<figure class="mb-4 w-full max-w-4xl"><figcaption class="mb-2 text-xs font-medium text-slate-500">${esc(label)}</figcaption>${r.image?`<img src="${r.image}" class="w-full rounded bg-white shadow object-top" alt="${esc(label)}">`:`<div class="rounded border-2 border-dashed bg-white p-8 text-center text-sm text-slate-400">缺少圖片${r.expectedImgName?`（預期檔名：${esc(r.expectedImgName)}）`:''}</div>`}</figure>`}
function renderAdmin(){const y=$('manageYear').value||allYears()[0];$('manageYear').value=y;const rows=state.rows.filter(r=>r.year===y).sort((a,b)=>a.order-b.order);$('adminList').innerHTML=rows.length?rows.map(r=>`<div class="rounded border border-slate-600 bg-slate-800 p-2"><div class="flex items-center justify-between gap-2"><span class="text-xs font-medium">${esc(r.num)}</span><span class="text-[10px] ${r.image?'text-emerald-300':'text-amber-300'}">${r.image?'✔ 圖片就緒':'等候圖檔'}</span></div><div class="mt-2 flex gap-2">${r.image?`<img src="${r.image}" class="h-16 w-20 rounded object-contain bg-white">`:''}<div class="min-w-0 flex-1"><p class="truncate text-[10px] text-slate-400">${esc(r.expectedImgName||'未設定檔名')}</p><button data-change="${esc(r.id)}" class="mt-1 rounded bg-blue-600 px-2 py-1 text-[10px]">變更圖片</button></div></div></div>`).join(''):'<p class="py-3 text-center text-xs text-slate-400">此年度尚未匯入試題</p>';document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{replaceTarget=b.dataset.change;$('replaceImage').click()})}
function fileData(file){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}
async function uploadImages(files,year){let changed=0, unmatched=[];for(const f of files){const name=f.name.replace(/\.[^.]+$/,'').trim();const targets=state.rows.filter(r=>r.year===year&&r.expectedImgName?.trim()===name);if(!targets.length){unmatched.push(f.name);continue}const data=await fileData(f);targets.forEach(r=>{r.image=data;r.imageName=f.name;changed++})}await save();renderAdmin();renderQuestions();$('uploadMessage').textContent=`已完成：${changed} 題圖片已綁定${unmatched.length?'；未對應：'+unmatched.join('、'):''}`}
function pick(row,keys){for(const k of keys){const found=Object.keys(row).find(x=>x.replace(/\s/g,'').toLowerCase()===k.replace(/\s/g,'').toLowerCase());if(found&&row[found]!==undefined)return String(row[found]).trim()}return ''}
async function importExcel(file){const data=await file.arrayBuffer(),book=XLSX.read(data),sheet=book.Sheets[book.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:''});const fallback=book.SheetNames[0].match(/\d{2,3}/)?.[0]||$('uploadYear').value||'';let n=0;rows.forEach((raw,i)=>{const year=pick(raw,['年度','會考年度','year'])||fallback,num=pick(raw,['題號','題目','題次','num']),unit=pick(raw,['單元','大單元','unit']),theme=pick(raw,['主題','子主題','theme']),semester=pick(raw,['學期','semester']),img=pick(raw,['expectedImgName','預期圖片檔名','圖片檔名','檔名']),group=pick(raw,['groupId','題組','題組編號']);if(!year||!num)return;const id=`${year}-${num}-${i}`;const old=state.rows.find(x=>x.year===year&&x.num===num);const obj={id:old?.id||id,year,num,unit,theme,semester,expectedImgName:img,groupId:group||undefined,isGroup:/題組背景|題組文章|共同引文/.test(num),order:i+1,image:old?.image||'',imageName:old?.imageName||''};if(old)Object.assign(old,obj);else state.rows.push(obj);if(!state.years.includes(year))state.years.push(year);n++});await save();renderSelectors();renderTree();renderQuestions();renderAdmin();$('excelMessage').textContent=`已依 Excel 原始排序匯入／更新 ${n} 筆資料。`}
function dropZone(id,cb){const z=$(id);['dragenter','dragover','dragleave','drop'].forEach(e=>z.addEventListener(e,x=>{x.preventDefault();x.stopPropagation()}));z.addEventListener('drop',e=>cb(e.dataTransfer.files))}
function bind(){ $('openAdmin').onclick=()=>$('drawer').classList.remove('closed');$('closeAdmin').onclick=()=>$('drawer').classList.add('closed');$('login').onclick=()=>{if($('password').value!=='75947')return alert('密碼錯誤');adminUnlocked=true;$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('logout').classList.remove('hidden');renderAdmin()};$('logout').onclick=()=>{adminUnlocked=false;$('password').value='';$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden');$('logout').classList.add('hidden')};$('addYear').onclick=async()=>{const y=$('newYear').value.trim();if(!/^\d{2,3}$/.test(y))return alert('請輸入年度，例如 114');if(!state.years.includes(y))state.years.push(y);await save();renderSelectors();$('uploadYear').value=y;$('manageYear').value=y;renderAdmin();$('newYear').value=''};$('yearFilter').onchange=e=>{filter.year=e.target.value;filter.unit=filter.theme=null;renderTree();renderQuestions()};$('search').oninput=e=>{filter.query=e.target.value.trim().toLowerCase();renderTree();renderQuestions()};$('collapseAll').onclick=()=>{document.querySelectorAll('.accordion').forEach(x=>x.classList.remove('open'))};$('manageYear').onchange=renderAdmin;$('clearYearImages').onclick=async()=>{const y=$('manageYear').value;if(!confirm(`確定清除 ${y} 年度的所有圖片？`))return;state.rows.filter(r=>r.year===y).forEach(r=>{r.image='';r.imageName=''});await save();renderAdmin();renderQuestions()};$('excelFile').onchange=e=>e.target.files[0]&&importExcel(e.target.files[0]);$('imageFile').onchange=e=>uploadImages(e.target.files,$('uploadYear').value);$('replaceImage').onchange=async e=>{const f=e.target.files[0],r=state.rows.find(x=>x.id===replaceTarget);if(f&&r){r.image=await fileData(f);r.imageName=f.name;await save();renderAdmin();renderQuestions();if(selected?.id===r.id)showDetail(r)}e.target.value=''};dropZone('excelDrop',f=>f[0]&&importExcel(f[0]));dropZone('imageDrop',f=>uploadImages(f,$('uploadYear').value))}
(async()=>{await load();bind();init()})();
</script></body></html>
