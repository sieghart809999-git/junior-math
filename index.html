<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中數學歷屆試題數據分析與管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        
        /* 解決問題6：新增精緻、顯眼的自訂卷軸，不再讓人找不到底下內容 */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; margin: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; border: 2px solid #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 防止圖片選取干擾拖曳 */
        img { user-select: none; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-slate-900 text-white shadow-md px-6 py-3 shrink-0 z-40">
        <div class="max-w-[1400px] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📐</span>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">國中數學歷屆試題對照管理系統 <span class="text-blue-400 text-sm">v4.0 滿版升級</span></h1>
                </div>
            </div>
            <button id="btnToggleAdminSidebar" class="flex items-center gap-1.5 text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg border border-slate-700 cursor-pointer transition-all">
                <span>⚙️</span> <span>管理後台</span>
            </button>
        </div>
    </header>

    <!-- 管理後台側邊欄 -->
    <div id="adminSidebar" class="fixed inset-y-0 left-0 w-80 bg-slate-800 text-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900">
            <h3 class="font-bold text-sm tracking-wider flex items-center gap-2"><span>🔒</span>系統設定與管理</h3>
            <button id="btnCloseSidebar" class="text-slate-400 hover:text-white text-sm">✕</button>
        </div>
        
        <div id="adminLoginWallet" class="p-6 flex-1 flex flex-col justify-center space-y-3">
            <p class="text-xs text-slate-400 text-center">請輸入管理者密碼開啟後台</p>
            <input type="password" id="adminPwdInput" placeholder="請輸入密碼" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <button id="btnAdminLogin" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-medium transition-colors">登入後台</button>
        </div>

        <div id="adminMainControls" class="hidden flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4">
            <div class="bg-red-900/30 p-2.5 rounded-lg border border-red-800/50">
                <button id="btnClearAllData" class="w-full bg-red-700 hover:bg-red-600 text-white text-[11px] py-1.5 rounded transition-colors">🗑️ 清除系統快取與所有資料</button>
            </div>
            <!-- Excel 匯入區 (支援拖曳) -->
            <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-700">
                <h4 class="text-xs font-bold text-slate-300 flex items-center gap-1 mb-1">📊 匯入 Excel 對照表</h4>
                <div id="excelDropZone" class="border-2 border-dashed border-slate-500 rounded-lg p-4 bg-slate-800/50 hover:bg-slate-800 text-center cursor-pointer transition-all">
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden">
                    <p class="text-xs font-bold text-slate-200">📁 拖曳 Excel 到此處 或 點擊選取</p>
                </div>
            </div>
            <!-- 圖片批次上傳區 (支援拖曳) -->
            <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-700">
                <h4 class="text-xs font-bold text-slate-300 flex items-center gap-1">🖼️ 批次試題圖片上傳</h4>
                <select id="adminUploadYearSelect" class="w-full bg-slate-800 border border-slate-600 rounded p-1 text-xs text-white my-1.5"></select>
                <div id="imageDropZone" class="border-2 border-dashed border-amber-500/60 rounded-lg p-4 bg-slate-800/50 hover:bg-slate-800 text-center cursor-pointer transition-all">
                    <input type="file" id="imageFileInput" accept="image/*" multiple class="hidden">
                    <p class="text-xs font-bold text-amber-400">📤 拖曳圖片到此處 或 點擊上傳</p>
                </div>
            </div>
            <!-- 後台預覽清單 -->
            <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-700 flex flex-col flex-1 min-h-[220px]">
                <div class="flex justify-between items-center mb-2">
                    <h4 class="text-xs font-bold text-slate-300">📋 對照管理清單</h4>
                    <select id="adminManageYearSelect" class="bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-[10px] text-white w-24"></select>
                </div>
                <div id="adminImageTableContainer" class="flex-1 overflow-y-auto custom-scrollbar space-y-1.5 pr-1 text-[11px]"></div>
            </div>
        </div>
    </div>

    <!-- 主畫面內容：鎖定高度，不隨內容膨脹 -->
    <main class="max-w-[1400px] mx-auto w-full p-4 flex-1 flex gap-4 overflow-hidden">
        
        <!-- ================= 左側：課綱結構區 ================= -->
        <div class="w-[420px] flex flex-col gap-3 shrink-0 h-full">
            
            <!-- 年度與搜尋過濾 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-3 shrink-0">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-gray-400">📅 會考年度</span>
                    <select id="yearSelectFilter" class="text-xs bg-slate-100 border border-slate-200 rounded px-2 py-1 font-bold text-slate-700"></select>
                </div>
                <!-- 解決問題5：學期快速過濾頁籤 -->

                    <button data-sem="七年級上學期" class="sem-tab text-[10px] px-2 py-1 rounded bg-gray-100 hover:bg-gray-200 text-gray-600">七上</button>
                    <button data-sem="七年級下學期" class="sem-tab text-[10px] px-2 py-1 rounded bg-gray-100 hover:bg-gray-200 text-gray-600">七下</button>
                    <button data-sem="八年級上學期" class="sem-tab text-[10px] px-2 py-1 rounded bg-gray-100 hover:bg-gray-200 text-gray-600">八上</button>
                    <button data-sem="八年級下學期" class="sem-tab text-[10px] px-2 py-1 rounded bg-gray-100 hover:bg-gray-200 text-gray-600">八下</button>
                    <button data-sem="九年級上學期" class="sem-tab text-[10px] px-2 py-1 rounded bg-gray-100 hover:bg-gray-200 text-gray-600">九上</button>
                    <button data-sem="九年級下學期" class="sem-tab text-[10px] px-2 py-1 rounded bg-gray-100 hover:bg-gray-200 text-gray-600">九下</button>
                </div>

            </div>

            <!-- 單元主題清單 (自帶卷軸) -->

                <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-2 shrink-0">

                    <button id="btnCollapseAll" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1 rounded transition-colors">全部收合</button>
                </div>
                <!-- 清單容器 -->
                <div id="unitTreeContainer" class="flex-1 overflow-y-auto custom-scrollbar space-y-1.5 pr-1"></div>
            </div>
        </div>

        <!-- ================= 右側：上下板塊區 (解決問題7) ================= -->
        <div class="flex-1 flex flex-col gap-3 min-w-0 h-full">
            
            <!-- 【上板塊】試題對照選單區 (固定高度區間，顯示專屬卷軸) -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-3 h-[180px] shrink-0 flex flex-col">
                <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-2 shrink-0">
                    <div>
                        <h2 class="text-sm font-bold text-gray-900 flex items-center gap-1.5"><span>🎯</span> <span>對應試題清單</span></h2>
                        <p class="text-[10px] text-blue-600 font-medium mt-0.5" id="currentScopeIndicator">範圍：顯示全部題目</p>
                    </div>
                    <span id="filteredCountTag" class="text-[11px] bg-blue-50 text-blue-700 px-2.5 py-0.5 rounded-full font-bold border border-blue-100">0 題</span>
                </div>
                
                <!-- 試題卡片列表 -->
                <div id="questionListCol" class="flex-1 overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                    <!-- 題目卡片動態產生處 -->
                </div>
            </div>

            <!-- 【下板塊】試題圖檔滿版預覽區 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex-1 flex flex-col overflow-hidden relative">

                    </div>
                    <span id="detailId" class="text-[9px] font-mono bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded"></span>
                </div>

                <div class="flex-1 bg-slate-50 border border-slate-200 rounded-lg overflow-y-auto custom-scrollbar p-2 flex justify-center items-start relative">

                    </div>

                    <!-- 圖片靠上對齊，寬度自適應撐滿 -->
                    <img id="detailImg" class="w-full max-w-4xl object-contain object-top hidden transition-all duration-300 rounded shadow-sm">
                </div>
            </div>

        </div>
    </main>

        // 解決問題3：內建 115 年度基本骨架資料（就算清空快取也會自動載入，不再空白）
        const default115Base = [
            { id: "115_第1題", year: "115", num: "第1題", unit: "第一章 整數運算與科學記號", theme: "1-2 整數的加減運算", expectedImgName: "1", imageName: "", imageBase64: "", excelRowIndex: 1 },
            { id: "115_第23題", year: "115", num: "第23題", unit: "第二章 統計與機率", theme: "2-2 機率", expectedImgName: "題組", imageName: "", imageBase64: "", excelRowIndex: 23 },
            { id: "115_第24題", year: "115", num: "第24題", unit: "第三章 立體幾何圖形", theme: "3-1 柱體、錐體與空間概念", expectedImgName: "題組", imageName: "", imageBase64: "", excelRowIndex: 24 },
            { id: "115_題組", year: "115", num: "題組", unit: "", theme: "", expectedImgName: "題組", imageName: "", imageBase64: "", excelRowIndex: 25 }
        ];

        // 系統狀態變數
        let examDatabase = [];
        let managedYears = [];
        let currentFilterYear = "115";
        let currentFilterUnit = null;
        let currentFilterTheme = null;
        
        // 解決問題5：學期與搜尋狀態，且「單獨展開」模式
        let currentSemester = "all";
        let searchKeyword = "";
        let activeAccordionUnit = null; // 紀錄當前唯一展開的大單元

        window.addEventListener('DOMContentLoaded', () => {
            loadDatabase();
            renderYearDropdown();
            setupEventListeners();
            setupDragAndDrop();
            refreshSystemUI();
        });

        function loadDatabase() {
            const storedDb = localStorage.getItem('math_exam_db_v4');
            const storedYears = localStorage.getItem('math_managed_years_v4');
            if (storedDb) {
                try { examDatabase = JSON.parse(storedDb); } catch(e) { examDatabase = [...default115Base]; }
            } else {
                examDatabase = [...default115Base]; // 載入內建 115 資料
            }
            
            if (storedYears) {
                try { managedYears = JSON.parse(storedYears); } catch(e) { managedYears = ["115"]; }
            } else {
                managedYears = ["115"];
            }
            updateGroupAssociations();
        }

        function saveDatabase() {
            localStorage.setItem('math_exam_db_v4', JSON.stringify(examDatabase));
            localStorage.setItem('math_managed_years_v4', JSON.stringify(managedYears));
        }

        function updateGroupAssociations() {
            examDatabase.sort((a,b) => (a.excelRowIndex || 0) - (b.excelRowIndex || 0));
            let currentGroupStemId = null;
            let currentGroupImg = null;

            examDatabase.forEach((q) => {
                if (q.num === '題組' || q.num.includes('題組')) {
                    currentGroupStemId = q.id;
                    currentGroupImg = q.expectedImgName;
                    q.belongsToGroupId = null;
                } else {
                    if (currentGroupStemId && (q.expectedImgName === currentGroupImg || !q.expectedImgName || q.expectedImgName.includes('題組'))) {
                        q.belongsToGroupId = currentGroupStemId;
                    } else {
                        if(q.expectedImgName && currentGroupImg && q.expectedImgName !== currentGroupImg) {
                            currentGroupStemId = null;
                            currentGroupImg = null;
                        }
                        q.belongsToGroupId = currentGroupStemId;
                    }
                }
            });
        }

        function renderYearDropdown() {
            const select = document.getElementById('yearSelectFilter');
            select.innerHTML = `<option value="all">顯示全部年度</option>`;
            const allYears = [...new Set([...managedYears, ...examDatabase.map(i => i.year)])].sort((a,b) => b - a);
            
            allYears.forEach(yr => {
                const opt = new Option(`${yr} 年度`, yr);
                if (yr === currentFilterYear) opt.selected = true;
                select.appendChild(opt);
            });

            // 同步更新後台的年度選單
            const upSelect = document.getElementById('adminUploadYearSelect');
            const mgSelect = document.getElementById('adminManageYearSelect');
            upSelect.innerHTML = ""; mgSelect.innerHTML = "";
            allYears.forEach(yr => {
                upSelect.appendChild(new Option(`${yr} 年度`, yr));
                mgSelect.appendChild(new Option(`${yr} 年度`, yr));
            });
        }

        function setupEventListeners() {
            // 後台開關
            document.getElementById('btnToggleAdminSidebar').onclick = () => document.getElementById('adminSidebar').classList.remove('-translate-x-full');
            document.getElementById('btnCloseSidebar').onclick = () => document.getElementById('adminSidebar').classList.add('-translate-x-full');
            document.getElementById('btnAdminLogin').onclick = () => {
                if (document.getElementById('adminPwdInput').value === "75947") {
                    document.getElementById('adminLoginWallet').classList.add('hidden');
                    document.getElementById('adminMainControls').classList.remove('hidden');
                    renderAdminImageTable();
                } else alert('密碼錯誤！');
            };
            document.getElementById('btnClearAllData').onclick = () => {
                if(confirm("⚠️ 確定要清除所有資料嗎？(包含你自己上傳的檔案)")) {
                    localStorage.removeItem('math_exam_db_v4');
                    localStorage.removeItem('math_managed_years_v4');
                    location.reload(); // 重整套用內建資料
                }
            };

            // 搜尋與過濾事件
            document.getElementById('yearSelectFilter').onchange = (e) => {
                currentFilterYear = e.target.value;
                currentFilterUnit = null; currentFilterTheme = null;
                refreshSystemUI();
            };
            
            document.getElementById('searchInput').oninput = (e) => {
                searchKeyword = e.target.value.trim().toLowerCase();
                refreshSystemUI();
            };

            document.getElementById('btnCollapseAll').onclick = () => {
                activeAccordionUnit = null;
                currentFilterUnit = null; currentFilterTheme = null;
                refreshSystemUI();
            };

            // 學期頁籤切換
            document.querySelectorAll('.sem-tab').forEach(btn => {
                btn.onclick = (e) => {
                    document.querySelectorAll('.sem-tab').forEach(b => {
                        b.className = "sem-tab text-[10px] px-2 py-1 rounded bg-gray-100 hover:bg-gray-200 text-gray-600";
                    });
                    e.target.className = "sem-tab text-[10px] px-2 py-1 rounded bg-blue-600 text-white font-bold";
                    currentSemester = e.target.getAttribute('data-sem');
                    activeAccordionUnit = null; // 切換學期自動收合
                    refreshSystemUI();
                };
            });
        }

        // HTML5 拖曳上傳
        function setupDragAndDrop() {
            const excelZone = document.getElementById('excelDropZone');
            const excelInput = document.getElementById('excelFileInput');
            excelZone.onclick = () => excelInput.click();
            excelInput.onchange = (e) => handleExcelImport(e.target.files[0]);
            bindDropEvents(excelZone, (files) => { if(files && files[0]) handleExcelImport(files[0]); });

            const imgZone = document.getElementById('imageDropZone');
            const imgInput = document.getElementById('imageFileInput');
            imgZone.onclick = () => imgInput.click();
            imgInput.onchange = (e) => handleImageUpload(e.target.files);
            bindDropEvents(imgZone, (files) => { if(files && files.length > 0) handleImageUpload(files); });
        }

        function bindDropEvents(zone, onDropCallback) {
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                zone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
            });
            ['dragenter', 'dragover'].forEach(eventName => {
                zone.addEventListener(eventName, () => zone.classList.add('border-blue-400', 'bg-slate-700'), false);
            });
            ['dragleave', 'drop'].forEach(eventName => {
                zone.addEventListener(eventName, () => zone.classList.remove('border-blue-400', 'bg-slate-700'), false);
            });
            zone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                if (dt && dt.files) onDropCallback(dt.files);
            }, false);
        }

        function refreshSystemUI() {
            // 基本題庫過濾 (依照選擇年度)
            let pool = currentFilterYear !== "all" ? examDatabase.filter(q => q.year === currentFilterYear) : examDatabase;

            // 標示狀態
            let scopeTxt = currentFilterYear === "all" ? "全部年度" : `${currentFilterYear}年度`;
            if(currentFilterTheme) scopeTxt += ` ➔ ${currentFilterTheme}`;
            else if(currentFilterUnit) scopeTxt += ` ➔ ${currentFilterUnit}`;
            document.getElementById('currentScopeIndicator').innerText = `範圍：${scopeTxt}`;

            renderUnitTree(pool);

            // 過濾要顯示在右側的試題
            let filteredQuestions = pool.filter(q => q.num !== '題組');
            if (currentFilterTheme) {
                filteredQuestions = filteredQuestions.filter(q => q.theme === currentFilterTheme);
            } else if (currentFilterUnit) {
                filteredQuestions = filteredQuestions.filter(q => q.unit === currentFilterUnit);
            } else {
                // 如果沒有選特定單元主題，為了避免右側太亂，不顯示題目 (或顯示全部)
                filteredQuestions = [];
            }

            // 抓出需要的題組文章
            const neededGroupIds = new Set(filteredQuestions.map(q => q.belongsToGroupId).filter(Boolean));
            let displayPool = [];
            
            if (currentFilterUnit || currentFilterTheme) {
                const relevantStems = pool.filter(q => q.num === '題組' && neededGroupIds.has(q.id));
                displayPool = [...filteredQuestions, ...relevantStems];
            }
            
            displayPool.sort((a,b) => (a.excelRowIndex || 0) - (b.excelRowIndex || 0));
            document.getElementById('filteredCountTag').innerText = `${displayPool.length} 題`;
            renderQuestionList(displayPool);
        }

        // 解決問題1 & 2 & 5：文字單元展開樹重製
        function renderUnitTree(pool) {
            const container = document.getElementById('unitTreeContainer');
            container.innerHTML = "";

            // 整理各單元與主題的題數 (只計算非題組母列)
            const questionOnlyPool = pool.filter(q => q.num !== '題組' && q.unit);
            const unitCounts = {};
            const themeCounts = {};
            questionOnlyPool.forEach(q => {
                unitCounts[q.unit] = (unitCounts[q.unit] || 0) + 1;
                if(q.theme) themeCounts[q.theme] = (themeCounts[q.theme] || 0) + 1;
            });

            // 整理所有大單元及其屬性，支援學期與搜尋過濾
            let displayUnits = [];
            const uniqueUnitsMap = new Map();

            Object.values(truthTable).forEach(item => {
                if (!uniqueUnitsMap.has(item.unit)) {
                    uniqueUnitsMap.set(item.unit, { semester: item.semester, name: item.unit, themes: new Set() });
                }
                uniqueUnitsMap.get(item.unit).themes.add(item.theme);
            });

            uniqueUnitsMap.forEach((data, unitName) => {
                // 學期過濾
                if (currentSemester !== "all" && data.semester !== currentSemester) return;
                
                // 關鍵字搜尋過濾 (單元名或主題名符合即可)
                if (searchKeyword) {
                    const matchUnit = unitName.toLowerCase().includes(searchKeyword);
                    const matchTheme = Array.from(data.themes).some(t => t.toLowerCase().includes(searchKeyword));
                    if (!matchUnit && !matchTheme) return;
                }
                displayUnits.push(data);
            });

            if (displayUnits.length === 0) {
                return container.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">無符合條件的單元</p>`;
            }

            displayUnits.forEach(unitData => {
                const unitName = unitData.name;
                const countInUnit = unitCounts[unitName] || 0;
                
                // 解決問題5：手風琴單一展開模式
                const isExpanded = activeAccordionUnit === unitName;
                const isUnitActive = currentFilterUnit === unitName && !currentFilterTheme;

                const unitCard = document.createElement('div');
                unitCard.className = `border rounded-md overflow-hidden transition-all ${isUnitActive ? 'border-blue-500 bg-blue-50/50' : 'border-gray-200 bg-white'}`;

                // 單元標頭 (解決問題1：點擊順暢展開收合)
                const header = document.createElement('div');
                header.className = "flex justify-between items-center p-2 cursor-pointer hover:bg-slate-50 transition-colors";
                header.innerHTML = `
                    <div class="flex items-center gap-1.5 font-bold text-gray-800">
                        <span class="text-gray-400 text-[10px] w-3 text-center">${isExpanded ? '▼' : '▶'}</span>
                        <span class="text-xs">${unitName}</span>
                    </div>
                    <span class="text-[9px] ${countInUnit > 0 ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-400'} font-semibold px-1.5 py-0.5 rounded">${countInUnit} 題</span>
                `;

                header.onclick = () => {
                    // 點擊時，若已經是展開的就關閉；若未展開則指定為唯一展開單元
                    activeAccordionUnit = isExpanded ? null : unitName;
                    currentFilterUnit = isExpanded ? null : unitName;
                    currentFilterTheme = null;
                    refreshSystemUI();
                };

                unitCard.appendChild(header);

                // 子主題清單 (解決問題2：包含 0 題的也要顯示)
                if (isExpanded) {
                    const themeListContainer = document.createElement('div');
                    themeListContainer.className = "bg-slate-50/70 border-t border-gray-100 p-1 space-y-0.5 pl-6";

                    Array.from(unitData.themes).forEach(themeName => {
                        const themeCount = themeCounts[themeName] || 0;
                        
                        // 若有搜尋關鍵字，未命中的主題隱藏 (除非單元本身命中)
                        if (searchKeyword && !themeName.toLowerCase().includes(searchKeyword) && !unitName.toLowerCase().includes(searchKeyword)) {
                            return; 
                        }

                        const themeRow = document.createElement('div');
                        const isThemeActive = currentFilterTheme === themeName;

                        themeRow.className = `flex justify-between items-center p-1.5 rounded cursor-pointer transition-colors ${
                            isThemeActive ? 'bg-blue-600 text-white font-bold' : 'hover:bg-gray-200/60 text-gray-600'
                        }`;

                        themeRow.innerHTML = `
                            <span class="text-[11px]">📌 ${themeName}</span>
                            <span class="text-[9px] ${isThemeActive ? 'bg-blue-800 text-white' : (themeCount > 0 ? 'bg-blue-100 text-blue-600' : 'bg-gray-200 text-gray-400')} px-1.5 rounded">${themeCount} 題</span>
                        `;

                        themeRow.onclick = (e) => {
                            e.stopPropagation();
                            currentFilterUnit = unitName;
                            currentFilterTheme = themeName;
                            refreshSystemUI();
                        };

                        themeListContainer.appendChild(themeRow);
                    });
                    unitCard.appendChild(themeListContainer);
                }
                container.appendChild(unitCard);
            });
        }

        function renderQuestionList(listPool) {
            const listCol = document.getElementById('questionListCol');
            listCol.innerHTML = "";

            if (listPool.length === 0) {
                // 清空預覽
                document.getElementById('detailEmptyState').classList.remove('hidden');
                document.getElementById('detailImg').classList.add('hidden');
                document.getElementById('detailTitle').innerText = "🖼️ 圖片預覽區";
                document.getElementById('detailUnitTheme').innerText = "請於上方點選試題以檢視完整圖檔";
                document.getElementById('detailId').innerText = "";
                
                if (currentFilterUnit || currentFilterTheme) {
                    listCol.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">本主題歷屆尚無出題紀錄</p>`;
                } else {
                    listCol.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">請在左側點選單元或主題以檢視題目</p>`;
                }
                return;
            }

            // 建立卡片
            listPool.forEach((q, index) => {
                const card = document.createElement('div');
                const isGroupStem = q.num === '題組';
                
                card.className = `question-card border rounded-lg p-2 cursor-pointer transition-all flex justify-between items-center ${
                    isGroupStem ? 'bg-amber-50/50 border-amber-200 hover:border-amber-400' : 'bg-white border-gray-200 hover:border-blue-400'
                }`;

                const statusColor = q.imageBase64 ? "bg-emerald-500" : (q.expectedImgName ? "bg-amber-400" : "bg-gray-300");
                const titleText = isGroupStem ? `【題組背景引文】` : `${q.num}`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full ${statusColor} shrink-0"></span>
                        <h4 class="font-bold text-[11px] ${isGroupStem ? 'text-amber-900' : 'text-slate-700'}">${titleText}</h4>
                    </div>
                    <span class="text-[9px] text-gray-400">${q.year}年</span>
                `;
                
                card.onclick = () => {
                    document.querySelectorAll('.question-card').forEach(c => c.classList.remove('border-blue-600', 'bg-blue-50', 'shadow-sm', 'border-amber-600'));
                    if(isGroupStem) card.classList.add('border-amber-600', 'bg-amber-50', 'shadow-sm');
                    else card.classList.add('border-blue-600', 'bg-blue-50', 'shadow-sm');
                    showQuestionDetail(q);
                };
                listCol.appendChild(card);
            });

            // 解決問題4：自動預選第一題並顯示預覽
            const firstCard = listCol.firstChild;
            if (firstCard) {
                firstCard.click(); 
                // 將捲軸滾到最頂端
                listCol.scrollTop = 0;
            }
        }

        // 解決問題7：滿版大圖顯示
        function showQuestionDetail(q) {
            document.getElementById('detailEmptyState').classList.add('hidden');
            
            const isGroupStem = q.num === '題組';
            document.getElementById('detailTitle').innerText = isGroupStem ? `📄 ${q.year} 年度 － 題組共同引文` : `📐 ${q.year} 年度 － ${q.num}`;
            document.getElementById('detailUnitTheme').innerText = isGroupStem ? "說明：此項目為題組引文，提供子題目共用" : `對應：${q.unit} ➔ ${q.theme || '無主題'}`;
            document.getElementById('detailId').innerText = `檔案要求: ${q.expectedImgName || '未指定'}`;

            const detailImg = document.getElementById('detailImg');

            if (q.imageBase64) {
                detailImg.src = q.imageBase64; 
                detailImg.classList.remove('hidden'); 
            } else { 
                detailImg.classList.add('hidden'); 
                document.getElementById('detailEmptyState').classList.remove('hidden');
                document.getElementById('detailEmptyState').innerHTML = `
                    <p class="text-4xl mb-2">⚠️</p>
                    <p class="text-xs font-medium">尚未上傳此題圖片<br><span class="text-[10px] text-gray-400 mt-1 block">預期圖檔名：${q.expectedImgName}.png</span></p>
                `;
            }
        }

        // --- Excel & 圖片匯入相關邏輯維持不變 ---
        function renderAdminImageTable() {
            const container = document.getElementById('adminImageTableContainer');
            container.innerHTML = "";
            const targetYear = document.getElementById('adminManageYearSelect').value;
            if(!targetYear) return;
            const yearRows = examDatabase.filter(q => q.year === targetYear).sort((a, b) => (a.excelRowIndex || 0) - (b.excelRowIndex || 0));
            if(yearRows.length === 0) return container.innerHTML = `<p class="text-[10px] text-slate-500 text-center py-2">該年度無數據</p>`;

            yearRows.forEach(q => {
                const wrapper = document.createElement('div');
                wrapper.className = `flex flex-col p-1.5 rounded border ${q.num === '題組' ? 'bg-amber-950/20 border-amber-800/40' : 'bg-slate-800 border-slate-700'}`;
                const fileColorClass = q.imageBase64 ? "text-emerald-400" : (q.expectedImgName ? "text-amber-400" : "text-rose-400");
                
                wrapper.innerHTML = `
                    <div class="flex justify-between items-center cursor-pointer" onclick="this.nextElementSibling.classList.toggle('hidden')">
                        <span class="font-bold text-slate-200 truncate pr-2">${q.num === '題組' ? '【題組引文】' : q.num}</span>
                        <span class="${fileColorClass} text-[9px] shrink-0">${q.imageBase64 ? "✔️ 圖片就緒" : (q.expectedImgName ? `等候圖檔` : "❌ 未配置")}</span>
                    </div>
                    <div class="hidden mt-1 p-1 bg-slate-900 rounded border border-slate-700 text-center">
                        ${q.imageBase64 ? `<img src="${q.imageBase64}" class="max-h-20 mx-auto object-contain">` : `<span class="text-[10px] text-slate-500">尚無圖檔</span>`}
                    </div>
                `;
                container.appendChild(wrapper);
            });
        }

        function handleExcelImport(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                if(rows.length === 0) return alert('Excel 內容為空！');

                const defaultYear = workbook.SheetNames[0].match(/\d{2,3}/)?.[0] || '115';
                let maxIndex = examDatabase.length > 0 ? Math.max(...examDatabase.map(d => d.excelRowIndex || 0)) : 0;
                let importedCount = 0;

                rows.forEach((row, idx) => {
                    const yearVal = String(row['年分'] || row['年份'] || defaultYear).trim();
                    const numVal = String(row['題號'] || row['題目'] || '').trim();
                    let unitVal = String(row['單元名稱（章）'] || row['單元'] || '').trim();
                    let themeVal = String(row['主題名稱（幾之幾）'] || row['主題'] || '').trim();
                    const expectedImg = String(row['圖片檔名'] || '').trim();

                    if(yearVal && numVal) {
                        const targetId = `${yearVal}_${numVal.replace(/\s+/g, '')}`;
                        const existIdx = examDatabase.findIndex(q => q.id === targetId);
                        
                        const itemData = {
                            id: targetId, year: yearVal, num: numVal,
                            unit: unitVal, theme: themeVal, expectedImgName: expectedImg,
                            imageName: expectedImg ? `${expectedImg}.png` : "",
                            imageBase64: existIdx !== -1 ? examDatabase[existIdx].imageBase64 : "",
                            excelRowIndex: existIdx !== -1 ? examDatabase[existIdx].excelRowIndex : (maxIndex + idx + 1)
                        };

                        if(existIdx !== -1) examDatabase[existIdx] = { ...examDatabase[existIdx], ...itemData };
                        else examDatabase.push(itemData);
                        
                        if(!managedYears.includes(yearVal)) managedYears.push(yearVal);
                        importedCount++;
                    }
                });
                updateGroupAssociations(); saveDatabase(); renderYearDropdown(); refreshSystemUI(); renderAdminImageTable();
                alert(`Excel 處理成功！共匯入/更新 ${importedCount} 筆項目。`);
            };
            reader.readAsArrayBuffer(file);
        }

        function handleImageUpload(files) {
            if (!files || files.length === 0) return;
            const targetYear = document.getElementById('adminUploadYearSelect').value;
            let affectedCount = 0; let processedCount = 0;
            const fileArray = Array.from(files);

            fileArray.forEach(file => {
                const cleanName = (file.name.substring(0, file.name.lastIndexOf('.')) || file.name).trim();
                const reader = new FileReader();
                reader.onload = function(e) {
                    examDatabase.forEach((q, idx) => {
                        if (q.year === targetYear && q.expectedImgName && q.expectedImgName.trim() === cleanName) {
                            examDatabase[idx].imageName = file.name;
                            examDatabase[idx].imageBase64 = e.target.result;
                            affectedCount++;
                        }
                    });
                    processedCount++;
                    if (processedCount === fileArray.length) {
                        saveDatabase(); refreshSystemUI(); renderAdminImageTable();
                        alert(`處理完成！共上傳 ${fileArray.length} 張，成功綁定 ${affectedCount} 題！`);
                    }
                };
                reader.readAsDataURL(file);
            });
        }
    </script>
