<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中數學歷屆試題數據分析與管理系統</title>
    <!-- Tailwind CSS & Chart.js & SheetJS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-md px-6 py-4 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📐</span>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">國中數學歷屆試題數據分析系統</h1>
                    <p class="text-xs text-slate-400 mt-0">專業級數據對照與圖檔黏合管理</p>
                </div>
            </div>
            <button id="btnToggleAdminSidebar" class="flex items-center gap-1.5 text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg border border-slate-700 cursor-pointer transition-all">
                <span>⚙️</span> <span>管理後台</span>
            </button>
        </div>
    </header>

    <!-- 管理後台 -->
    <div id="adminSidebar" class="fixed inset-y-0 left-0 w-80 bg-slate-800 text-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900">
            <h3 class="font-bold text-sm tracking-wider flex items-center gap-2"><span>🔒</span>系統設定與管理</h3>
            <button id="btnCloseSidebar" class="text-slate-400 hover:text-white text-sm">✕</button>
        </div>
        
        <div id="adminLoginWallet" class="p-6 flex-1 flex flex-col justify-center space-y-3">
            <p class="text-xs text-slate-400 text-center">請輸入管理者密碼開啟後台</p>
            <input type="password" id="adminPwdInput" placeholder="預設密碼 75947" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <button id="btnAdminLogin" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-medium transition-colors">登入後台</button>
        </div>

        <div id="adminMainControls" class="hidden flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
            <!-- 危險操作區 -->
            <div class="bg-red-900/30 p-2.5 rounded-lg border border-red-800/50">
                <button id="btnClearAllData" class="w-full bg-red-700 hover:bg-red-600 text-white text-[11px] py-1.5 rounded transition-colors flex items-center justify-center gap-1">
                    <span>🗑️</span> 清除系統快取與所有資料 (初始化)
                </button>
            </div>

            <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-700">
                <h4 class="text-xs font-bold text-slate-300 flex items-center gap-1 mb-1">📊 步驟一：匯入 Excel 對照表</h4>
                <p class="text-[10px] text-slate-400 mb-2">請上傳包含「題號、單元、主題、圖片檔名、題組」等欄位的檔案。</p>
                <div id="excelDropZone" class="border-2 border-dashed border-slate-600 rounded-lg p-2 bg-slate-800/50 hover:bg-slate-800 text-center cursor-pointer">
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden">
                    <p class="text-[11px] font-bold text-slate-200">📁 點擊選取試算表</p>
                </div>
            </div>

            <!-- 新增單筆試題 -->
            <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-700">
                <h4 class="text-xs font-bold text-slate-300 flex items-center gap-1 mb-2">➕ 新增單筆/新年度試題</h4>
                <div class="space-y-1.5 text-[10px]">
                    <div class="flex gap-1.5">
                        <input type="text" id="addYear" placeholder="年度(如116)" class="w-1/3 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white">
                        <input type="text" id="addNum" placeholder="題號(如第1題)" class="w-2/3 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white">
                    </div>
                    <input type="text" id="addUnit" placeholder="大單元 (或題組名稱)" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white">
                    <input type="text" id="addTheme" placeholder="子主題 (可留白)" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white">
                    <div class="flex gap-1.5">
                        <input type="text" id="addImgName" placeholder="對應圖檔名" class="flex-1 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white">
                        <button id="btnManualAdd" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2 rounded transition-colors">新增</button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-700">
                <h4 class="text-xs font-bold text-slate-300 flex items-center gap-1">🖼️ 步驟二：批量圖片上傳</h4>
                <select id="adminUploadYearSelect" class="w-full bg-slate-800 border border-slate-600 rounded p-1 text-xs text-white my-1.5"></select>
                <div id="imageDropZone" class="border-2 border-dashed border-amber-500/50 rounded-lg p-2 bg-slate-800/50 hover:bg-slate-800 text-center cursor-pointer">
                    <input type="file" id="imageFileInput" accept="image/*" multiple class="hidden">
                    <p class="text-[11px] font-bold text-amber-400">📤 點擊上傳圖片圖檔</p>
                </div>
            </div>

            <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-700 flex flex-col flex-1 min-h-[250px]">
                <div class="flex justify-between items-center mb-2">
                    <h4 class="text-xs font-bold text-slate-300">📋 對照管理清單</h4>
                    <select id="adminManageYearSelect" class="bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-[10px] text-white w-24"></select>
                </div>
                <!-- 預覽容器 -->
                <div id="adminImageTableContainer" class="flex-1 overflow-y-auto space-y-1.5 pr-1 no-scrollbar text-[11px]"></div>
            </div>
        </div>
    </div>

    <!-- 主畫面 -->
    <main class="max-w-7xl mx-auto w-full p-4 lg:p-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-5 space-y-4 flex flex-col">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
                <span class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">📊 篩選會考年度數據源</span>
                <div id="yearButtonsGroup" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col flex-1">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h2 class="text-sm font-bold text-gray-900 flex items-center gap-1" id="chartTitle">📈 歷屆考題單元分佈</h2>
                        <p class="text-[10px] text-gray-400 mt-0.5">點擊圖表可連動右側題目篩選</p>
                    </div>
                    <div class="flex bg-gray-100 p-0.5 rounded-md text-[10px] border border-gray-200">
                        <button id="btnChartBar" class="px-2 py-1 rounded bg-white text-gray-800 font-bold shadow-sm">長條圖</button> 
                        <button id="btnChartPie" class="px-2 py-1 rounded text-gray-500 hover:text-gray-800">圓餅圖</button>
                    </div>
                </div>

                <!-- 長條圖排序模式切換 -->
                <div id="barModeControls" class="flex gap-2 mb-2">
                    <button id="btnBarHierarchy" class="text-[10px] bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded font-medium">階層模式 (依單元排序)</button>
                    <button id="btnBarFreq" class="text-[10px] bg-gray-50 text-gray-500 border border-gray-200 px-2 py-0.5 rounded">頻率模式 (依題數排序)</button>
                </div>

                <!-- 圓餅圖/單元回退按鈕 -->
                <button id="btnClearChartFilter" class="hidden mb-2 text-left text-xs text-blue-600 hover:text-blue-800 flex items-center gap-1 font-medium transition-colors">
                    ← 返回上一層顯示
                </button>

                <div class="relative w-full h-80 flex items-center justify-center mt-auto">
                    <canvas id="mainAnalysisChart"></canvas>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col min-h-[550px]">
            <div class="border-b border-gray-100 pb-3 mb-4 flex justify-between items-center">
                <div>
                    <h2 class="text-sm font-bold text-gray-900 flex items-center gap-1.5"><span>🔍</span> <span>試題清單與大圖對照</span></h2>
                    <p class="text-[10px] text-blue-600 font-medium mt-0.5" id="currentScopeIndicator">當前範圍：顯示全部年度</p>
                </div>
                <span id="filteredCountTag" class="text-[11px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full font-bold border border-blue-100"></span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 flex-1 items-stretch">
                <!-- 試題清單 (根據 Excel 原始排序) -->
                <div id="questionListCol" class="md:col-span-4 space-y-2 max-h-[550px] overflow-y-auto pr-1 no-scrollbar"></div>
                
                <div id="questionDetailCol" class="md:col-span-8 border border-gray-200 rounded-xl bg-slate-50 p-4 flex flex-col justify-between min-h-[380px]">
                    <div id="detailEmptyState" class="m-auto text-center text-gray-400 text-xs space-y-2">
                        <p class="text-3xl">🖼️</p>
                        <p class="font-medium text-gray-500">請點選左側試題進行大圖對照</p>
                    </div>

                    <div id="detailContent" class="hidden flex flex-col h-full justify-between">
                        <div class="space-y-3 flex-1 flex flex-col">
                            <div class="flex justify-between items-start border-b border-gray-200 pb-2">
                                <div>
                                    <h4 id="detailTitle" class="font-bold text-[13px] text-blue-900"></h4>
                                    <p id="detailUnitTheme" class="text-[10px] text-gray-500 mt-0.5"></p>
                                </div>
                                <span id="detailId" class="text-[9px] font-mono bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded"></span>
                            </div>
                            
                            <div class="bg-white rounded-lg border border-gray-300 p-2 min-h-[300px] flex-1 flex items-center justify-center text-center shadow-inner overflow-hidden relative">
                                <img id="detailImg" class="max-h-80 max-w-full object-contain hidden transition-all duration-200">
                                <div id="noImgWarning" class="text-gray-400 text-[11px] space-y-1 hidden">
                                    <p class="text-xl">⚠️</p><p>尚未配置或上傳圖檔</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 【核心資料庫】為避免重複，移除內建假資料，完全依賴使用者匯入或手動新增。
        let examDatabase = [];
        
        // 系統狀態控制
        let currentFilterYear = "all";
        let currentFilterUnit = null;  // 圓餅圖選中的大單元
        let currentFilterTheme = null; // 長條圖選中的子主題
        
        // 圖表控制
        let chartInstance = null;
        let globalChartType = "bar"; // 'bar' | 'pie'
        let barSortMode = "hierarchy"; // 'hierarchy' | 'frequency'

        // 預設配色庫 (自動賦予不同單元固定顏色)
        const colorPalette = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4', '#f97316', '#64748b'];
        const unitColorMap = {};

        window.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('admin_pwd_gate')) localStorage.setItem('admin_pwd_gate', '75947');
            loadDatabase();
            renderYearButtons();
            setupEventListeners();
            refreshSystemUI();
        });

        function loadDatabase() {
            const stored = localStorage.getItem('github_exam_db');
            if (stored) {
                try { examDatabase = JSON.parse(stored); } catch(e) { examDatabase = []; }
            } else { examDatabase = []; }
            assignUnitColors();
        }

        function saveDatabase() {
            localStorage.setItem('github_exam_db', JSON.stringify(examDatabase));
            assignUnitColors();
        }

        function assignUnitColors() {
            let colorIndex = 0;
            examDatabase.forEach(q => {
                if(q.unit && !unitColorMap[q.unit]) {
                    unitColorMap[q.unit] = colorPalette[colorIndex % colorPalette.length];
                    colorIndex++;
                }
            });
        }

        function renderYearButtons() {
            const container = document.getElementById('yearButtonsGroup');
            container.innerHTML = "";
            const years = [...new Set(examDatabase.map(item => item.year))].sort((a,b) => b - a);
            
            const btnClass = "font-medium text-xs py-1.5 px-3 rounded-lg cursor-pointer transition-colors ";
            
            const allBtn = document.createElement('button');
            allBtn.innerText = "顯示全部年度";
            allBtn.className = btnClass + (currentFilterYear === "all" ? "bg-slate-800 text-white shadow" : "bg-gray-100 hover:bg-gray-200 text-gray-700");
            allBtn.onclick = () => { currentFilterYear = "all"; currentFilterUnit = null; currentFilterTheme = null; refreshSystemUI(); renderYearButtons(); };
            container.appendChild(allBtn);

            years.forEach(yr => {
                const btn = document.createElement('button');
                btn.innerText = `${yr} 年度`;
                btn.className = btnClass + (currentFilterYear === yr ? "bg-slate-800 text-white shadow" : "bg-gray-100 hover:bg-gray-200 text-gray-700");
                btn.onclick = () => { currentFilterYear = yr; currentFilterUnit = null; currentFilterTheme = null; refreshSystemUI(); renderYearButtons(); };
                container.appendChild(btn);
            });

            updateAdminYearSelects(years);
        }

        function updateAdminYearSelects(years) {
            const upSelect = document.getElementById('adminUploadYearSelect');
            const mgSelect = document.getElementById('adminManageYearSelect');
            upSelect.innerHTML = ""; mgSelect.innerHTML = "";
            if(years.length === 0) {
                upSelect.innerHTML = "<option value=''>無資料</option>";
                mgSelect.innerHTML = "<option value=''>無資料</option>";
                return;
            }
            years.forEach(yr => {
                upSelect.appendChild(new Option(`${yr}年度`, yr));
                mgSelect.appendChild(new Option(`${yr}年度`, yr));
            });
            renderAdminImageTable();
        }

        function setupEventListeners() {
            // 後台開關
            document.getElementById('btnToggleAdminSidebar').onclick = () => document.getElementById('adminSidebar').classList.remove('-translate-x-full');
            document.getElementById('btnCloseSidebar').onclick = () => document.getElementById('adminSidebar').classList.add('-translate-x-full');

            // 後台登入
            document.getElementById('btnAdminLogin').onclick = () => {
                if (document.getElementById('adminPwdInput').value === localStorage.getItem('admin_pwd_gate')) {
                    document.getElementById('adminLoginWallet').classList.add('hidden');
                    document.getElementById('adminMainControls').classList.remove('hidden');
                    renderAdminImageTable();
                } else alert('密碼錯誤！');
            };

            // 清除資料
            document.getElementById('btnClearAllData').onclick = () => {
                if(confirm("⚠️ 確定要清除系統內的所有資料(包含圖片與題庫)嗎？\n清除後需重新匯入 Excel！")) {
                    localStorage.removeItem('github_exam_db');
                    examDatabase = [];
                    currentFilterYear = "all"; currentFilterUnit = null; currentFilterTheme = null;
                    refreshSystemUI(); renderYearButtons(); renderAdminImageTable();
                    alert("資料已清空！請重新匯入對照表。");
                }
            };

            // 手動新增題目
            document.getElementById('btnManualAdd').onclick = () => {
                const yr = document.getElementById('addYear').value.trim();
                const num = document.getElementById('addNum').value.trim();
                if(!yr || !num) return alert("年度與題號為必填！");
                
                const newId = `${yr}_${num.replace(/\s+/g, '')}`;
                const maxIndex = examDatabase.length > 0 ? Math.max(...examDatabase.map(d => d.excelRowIndex || 0)) : 0;
                
                examDatabase.push({
                    id: newId, year: yr, num: num,
                    unit: document.getElementById('addUnit').value.trim() || "手動新增題組",
                    theme: document.getElementById('addTheme').value.trim() || "",
                    expectedImgName: document.getElementById('addImgName').value.trim(),
                    imageName: document.getElementById('addImgName').value.trim() ? `${document.getElementById('addImgName').value.trim()}.png` : "",
                    imageBase64: "",
                    excelRowIndex: maxIndex + 1
                });
                
                document.getElementById('addNum').value = ""; document.getElementById('addImgName').value = "";
                saveDatabase(); renderYearButtons(); refreshSystemUI(); renderAdminImageTable();
                alert(`已新增 ${yr}年度 - ${num}！`);
            };

            // 圖表模式切換按鈕
            document.getElementById('btnChartBar').onclick = () => { 
                globalChartType = "bar"; 
                document.getElementById('btnChartBar').className = "px-2 py-1 rounded bg-white text-gray-800 font-bold shadow-sm";
                document.getElementById('btnChartPie').className = "px-2 py-1 rounded text-gray-500 hover:text-gray-800";
                document.getElementById('barModeControls').classList.remove('hidden');
                refreshSystemUI(); 
            };
            document.getElementById('btnChartPie').onclick = () => { 
                globalChartType = "pie"; 
                document.getElementById('btnChartPie').className = "px-2 py-1 rounded bg-white text-gray-800 font-bold shadow-sm";
                document.getElementById('btnChartBar').className = "px-2 py-1 rounded text-gray-500 hover:text-gray-800";
                document.getElementById('barModeControls').classList.add('hidden');
                refreshSystemUI(); 
            };

            document.getElementById('btnBarHierarchy').onclick = () => {
                barSortMode = "hierarchy";
                document.getElementById('btnBarHierarchy').className = "text-[10px] bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded font-medium";
                document.getElementById('btnBarFreq').className = "text-[10px] bg-gray-50 text-gray-500 border border-gray-200 px-2 py-0.5 rounded";
                refreshSystemUI();
            };
            document.getElementById('btnBarFreq').onclick = () => {
                barSortMode = "frequency";
                document.getElementById('btnBarFreq').className = "text-[10px] bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded font-medium";
                document.getElementById('btnBarHierarchy').className = "text-[10px] bg-gray-50 text-gray-500 border border-gray-200 px-2 py-0.5 rounded";
                refreshSystemUI();
            };

            // 清除過濾器
            document.getElementById('btnClearChartFilter').onclick = () => {
                if (globalChartType === 'pie' && currentFilterUnit) currentFilterUnit = null; // 圓餅圖返回單元全覽
                currentFilterTheme = null; // 清除主題過濾
                refreshSystemUI();
            };

            document.getElementById('adminManageYearSelect').onchange = renderAdminImageTable;

            // Excel 檔案上傳
            const xlZone = document.getElementById('excelDropZone');
            xlZone.onclick = () => document.getElementById('excelFileInput').click();
            document.getElementById('excelFileInput').onchange = (e) => handleExcelImport(e.target.files[0]);

            // 圖片上傳
            const imgZone = document.getElementById('imageDropZone');
            imgZone.onclick = () => document.getElementById('imageFileInput').click();
            document.getElementById('imageFileInput').onchange = (e) => handleImageUpload(e.target.files);
        }

        function refreshSystemUI() {
            let pool = currentFilterYear !== "all" ? examDatabase.filter(q => q.year === currentFilterYear) : examDatabase;
            
            // 指示器文字更新
            let scopeTxt = currentFilterYear === "all" ? "全部歷屆年度" : `${currentFilterYear}年度`;
            if(currentFilterUnit) scopeTxt += ` > ${currentFilterUnit}`;
            if(currentFilterTheme) scopeTxt += ` > ${currentFilterTheme}`;
            document.getElementById('currentScopeIndicator').innerText = `範圍：${scopeTxt}`;

            // 控制返回按鈕顯示
            const btnClear = document.getElementById('btnClearChartFilter');
            if(currentFilterTheme || (globalChartType === 'pie' && currentFilterUnit)) btnClear.classList.remove('hidden');
            else btnClear.classList.add('hidden');

            renderAnalyticsChart(pool);

            // 清單過濾 (嚴格遵循 Excel 原始排序 excelRowIndex)
            let listPool = pool;
            if (currentFilterTheme) {
                // 如果有點擊長條圖主題，則過濾出該主題 (相容合併字串)
                listPool = pool.filter(q => {
                    const tName = q.theme ? `${q.unit} - ${q.theme}` : q.unit;
                    return tName === currentFilterTheme;
                });
            } else if (currentFilterUnit) {
                // 如果有點擊圓餅圖大單元，則過濾該大單元
                listPool = pool.filter(q => q.unit === currentFilterUnit);
            }
            
            document.getElementById('filteredCountTag').innerText = `共 ${listPool.length} 題`;
            renderQuestionList(listPool);
        }

        // 核心圖表渲染邏輯
        function renderAnalyticsChart(dataPool) {
            const ctx = document.getElementById('mainAnalysisChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            if(dataPool.length === 0) return;

            if (globalChartType === "pie") {
                // 【圓餅圖邏輯】
                document.getElementById('chartTitle').innerText = currentFilterUnit ? `📈 ${currentFilterUnit} ➔ 主題分佈` : "📈 歷屆考題大單元分佈";
                const distribution = {};
                
                if (!currentFilterUnit) {
                    // 第一層：顯示所有大單元
                    dataPool.forEach(q => { distribution[q.unit] = (distribution[q.unit] || 0) + 1; });
                    const labels = Object.keys(distribution);
                    const bgColors = labels.map(lbl => unitColorMap[lbl] || '#94a3b8');
                    
                    chartInstance = new Chart(ctx, {
                        type: 'pie',
                        data: { labels: labels, datasets: [{ data: Object.values(distribution), backgroundColor: bgColors }] },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: {size: 10} } } },
                            onClick: (e, els) => {
                                if (els.length > 0) {
                                    currentFilterUnit = labels[els[0].index];
                                    currentFilterTheme = null; // 重置主題
                                    refreshSystemUI();
                                }
                            }
                        }
                    });
                } else {
                    // 第二層：顯示選定大單元下的主題 (Drill-down)
                    const unitPool = dataPool.filter(q => q.unit === currentFilterUnit);
                    unitPool.forEach(q => { const key = q.theme || '無子主題/題組'; distribution[key] = (distribution[key] || 0) + 1; });
                    const labels = Object.keys(distribution);
                    // 產生同色系的漸層色
                    const baseColor = unitColorMap[currentFilterUnit] || '#3b82f6';
                    const bgColors = labels.map((_, i) => `${baseColor}${Math.max(99 - i*15, 20)}`); // Hex 透明度

                    chartInstance = new Chart(ctx, {
                        type: 'doughnut',
                        data: { labels: labels, datasets: [{ data: Object.values(distribution), backgroundColor: bgColors }] },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: {size: 10} } } },
                            onClick: (e, els) => {
                                if (els.length > 0) {
                                    const clickedTheme = labels[els[0].index];
                                    currentFilterTheme = clickedTheme === '無子主題/題組' ? currentFilterUnit : `${currentFilterUnit} - ${clickedTheme}`;
                                    refreshSystemUI();
                                }
                            }
                        }
                    });
                }
            } else {
                // 【長條圖邏輯】
                document.getElementById('chartTitle').innerText = "📈 單元主題考題數量排行";
                
                // 先彙整所有 主題 (如沒有主題則歸大單元)
                const distMap = {};
                dataPool.forEach(q => {
                    const key = q.theme ? `${q.unit} - ${q.theme}` : q.unit;
                    if(!distMap[key]) distMap[key] = { count: 0, unit: q.unit, theme: q.theme || '無主題' };
                    distMap[key].count++;
                });

                let sortedKeys = Object.keys(distMap);
                
                if (barSortMode === "hierarchy") {
                    // 階層排序：依單元名稱字串排序，再依主題排序
                    sortedKeys.sort((a, b) => distMap[a].unit.localeCompare(distMap[b].unit) || distMap[a].theme.localeCompare(distMap[b].theme));
                } else {
                    // 頻率排序：數量大到小，數量相同才比名稱
                    sortedKeys.sort((a, b) => distMap[b].count - distMap[a].count || distMap[a].unit.localeCompare(distMap[b].unit));
                }

                const labels = sortedKeys;
                const dataVals = labels.map(k => distMap[k].count);
                // 階層模式下，同單元顯示同顏色；被點擊過濾時高亮
                const bgColors = labels.map(k => {
                    if (currentFilterTheme === k) return '#ef4444'; // 高亮紅
                    return unitColorMap[distMap[k].unit] || '#3b82f6';
                });

                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels.map(l => l.includes(' - ') ? l.split(' - ')[1] : l), // 只顯示後半段名稱省空間
                        datasets: [{ data: dataVals, backgroundColor: bgColors, borderRadius: 4 }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
                        plugins: { 
                            legend: { display: false },
                            tooltip: { callbacks: { title: (ctx) => labels[ctx[0].dataIndex] } } // Tooltip顯示完整名稱
                        },
                        scales: { x: { beginAtZero: true, ticks: { stepSize: 1, font: {size:10} } }, y: { ticks: {font: {size:10}} } },
                        onClick: (e, els) => {
                            if (els.length > 0) {
                                const clickedKey = labels[els[0].index];
                                currentFilterTheme = currentFilterTheme === clickedKey ? null : clickedKey;
                                refreshSystemUI();
                            }
                        }
                    }
                });
            }
        }

        function renderQuestionList(listPool) {
            const listCol = document.getElementById('questionListCol');
            listCol.innerHTML = "";
            if (listPool.length === 0) return listCol.innerHTML = `<p class="text-xs text-gray-400 text-center py-8">本區間無對應試題</p>`;

            // ⚠️ 嚴格遵循 Excel 列數排序
            listPool.sort((a, b) => (a.excelRowIndex || 0) - (b.excelRowIndex || 0));

            listPool.forEach(q => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-lg p-2.5 shadow-2xs hover:border-blue-500 hover:bg-blue-50/20 cursor-pointer transition-all flex justify-between items-center";
                const dotColor = (q.imageBase64) ? "bg-emerald-500" : (q.expectedImgName ? "bg-amber-400" : "bg-gray-300");
                
                const displayTheme = q.theme || '題組資料';
                
                card.innerHTML = `<div class="flex items-center gap-2 overflow-hidden w-full"><span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span><div class="truncate w-full"><h4 class="font-bold text-xs text-slate-800">${q.year}年 - ${q.num}</h4><p class="text-[9px] text-gray-400 truncate mt-0.5">${q.unit} > ${displayTheme}</p></div></div>`;
                card.onclick = () => {
                    document.querySelectorAll('#questionListCol > div').forEach(d => d.classList.remove('border-blue-600', 'bg-blue-50/40'));
                    card.classList.add('border-blue-600', 'bg-blue-50/40');
                    showQuestionDetail(q);
                };
                listCol.appendChild(card);
            });
        }

        function showQuestionDetail(q) {
            document.getElementById('detailEmptyState').classList.add('hidden');
            document.getElementById('detailContent').classList.remove('hidden');
            document.getElementById('detailTitle').innerText = `${q.year} 年度 － ${q.num}`;
            document.getElementById('detailUnitTheme').innerText = `歸屬：${q.unit} ${q.theme ? '> '+q.theme : ''}`;
            document.getElementById('detailId').innerText = `ID: ${q.id}`;

            const detailImg = document.getElementById('detailImg');
            const noImgWarning = document.getElementById('noImgWarning');

            if (q.imageBase64) {
                detailImg.src = q.imageBase64; 
                detailImg.classList.remove('hidden'); 
                noImgWarning.classList.add('hidden');
            } else { 
                detailImg.classList.add('hidden'); 
                noImgWarning.classList.remove('hidden'); 
            }
        }

        function renderAdminImageTable() {
            const container = document.getElementById('adminImageTableContainer');
            container.innerHTML = "";
            const targetYear = document.getElementById('adminManageYearSelect').value;
            if(!targetYear) return;

            const yearRows = examDatabase.filter(q => q.year === targetYear);
            if(yearRows.length === 0) return container.innerHTML = `<p class="text-[10px] text-slate-500 text-center py-2">該年度無資料</p>`;

            // ⚠️ 後台清單同樣遵循 Excel 列數排序
            yearRows.sort((a, b) => (a.excelRowIndex || 0) - (b.excelRowIndex || 0));

            yearRows.forEach(q => {
                const wrapper = document.createElement('div');
                wrapper.className = "flex flex-col bg-slate-800 p-1.5 rounded border border-slate-700";
                
                const topRow = document.createElement('div');
                topRow.className = "flex justify-between items-center";
                
                const fileColorClass = q.imageBase64 ? "text-emerald-400" : (q.expectedImgName ? "text-amber-400" : "text-rose-400");
                const statusTxt = q.imageBase64 ? "✔️ 圖片已就緒" : (q.expectedImgName ? `等候上傳: ${q.expectedImgName}` : "無綁定檔名");

                topRow.innerHTML = `
                    <div class="truncate pr-2 cursor-pointer flex-1" onclick="this.parentElement.nextElementSibling.classList.toggle('hidden')">
                        <span class="font-bold text-slate-200">${q.num}:</span>
                        <span class="${fileColorClass} text-[9px] ml-1"> ${statusTxt} </span>
                        ${q.imageBase64 ? '<span class="ml-1 text-slate-400 text-[10px] bg-slate-700 px-1 rounded hover:text-white">👁️ 預覽</span>' : ''}
                    </div>
                `;
                
                // 圖片預覽區塊 (預設隱藏)
                const previewRow = document.createElement('div');
                previewRow.className = "hidden mt-2 p-1 bg-slate-900 rounded border border-slate-700 text-center";
                if(q.imageBase64) {
                    previewRow.innerHTML = `<img src="${q.imageBase64}" class="max-h-32 mx-auto object-contain">`;
                } else {
                    previewRow.innerHTML = `<span class="text-[10px] text-slate-500">尚無圖片內容</span>`;
                }

                wrapper.appendChild(topRow);
                wrapper.appendChild(previewRow);
                container.appendChild(wrapper);
            });
        }

        // Excel 匯入
        function handleExcelImport(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                if(rows.length === 0) return alert('Excel 內容為空或讀取失敗！');

                const yearMatch = sheetName.match(/\d{2,3}/);
                const defaultYear = yearMatch ? yearMatch[0] : '115';

                // 計算當前資料庫最大 index，接續排列
                let maxIndex = examDatabase.length > 0 ? Math.max(...examDatabase.map(d => d.excelRowIndex || 0)) : 0;

                let importedCount = 0;
                rows.forEach((row, idx) => {
                    const yearVal = String(row['年分'] || row['年份'] || defaultYear).trim();
                    const numVal = String(row['題號'] || '').trim();
                    
                    // 題組相容處理：先找單元名稱，若無則找題組欄位
                    let unitVal = String(row['單元名稱（章）'] || row['單元'] || '').trim();
                    let themeVal = String(row['主題名稱（幾之幾）'] || row['主題'] || '').trim();
                    
                    if (!unitVal) {
                        const groupVal = String(row['題組'] || '').trim();
                        unitVal = groupVal ? `題組：${groupVal}` : "綜合題組";
                    }

                    const expectedImg = String(row['圖片檔名'] || '').trim();

                    if(yearVal && numVal) {
                        const targetId = `${yearVal}_${numVal.replace(/\s+/g, '')}`;
                        const existIdx = examDatabase.findIndex(q => q.id === targetId);
                        
                        const itemData = {
                            id: targetId, year: yearVal, num: numVal,
                            unit: unitVal, theme: themeVal, expectedImgName: expectedImg,
                            imageName: expectedImg ? `${expectedImg}.png` : "",
                            imageBase64: existIdx !== -1 ? examDatabase[existIdx].imageBase64 : "",
                            excelRowIndex: existIdx !== -1 ? examDatabase[existIdx].excelRowIndex : (maxIndex + idx + 1) // 保留原始順序
                        };

                        if(existIdx !== -1) examDatabase[existIdx] = { ...examDatabase[existIdx], ...itemData };
                        else examDatabase.push(itemData);
                        importedCount++;
                    }
                });

                saveDatabase(); renderYearButtons(); refreshSystemUI(); renderAdminImageTable();
                alert(`Excel 匯入完成！成功處理 ${importedCount} 筆資料。`);
            };
            reader.readAsArrayBuffer(file);
        }

        // 圖片上傳
        function handleImageUpload(files) {
            if (!files || files.length === 0) return;
            const targetYear = document.getElementById('adminUploadYearSelect').value;
            let matchFileCount = 0; let affectedCount = 0; let processedCount = 0;
            const fileArray = Array.from(files);

            fileArray.forEach(file => {
                const rawName = file.name;
                const cleanNameWithoutExt = rawName.substring(0, rawName.lastIndexOf('.')) || rawName;
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    let fileMatched = false;
                    examDatabase.forEach((q, idx) => {
                        if (q.year === targetYear) {
                            const isImgNameMatch = q.expectedImgName && (q.expectedImgName === rawName || q.expectedImgName === cleanNameWithoutExt);
                            if (isImgNameMatch) {
                                examDatabase[idx].imageName = rawName;
                                examDatabase[idx].imageBase64 = e.target.result;
                                fileMatched = true; affectedCount++;
                            }
                        }
                    });

                    if (fileMatched) matchFileCount++;
                    processedCount++;
                    
                    if (processedCount === fileArray.length) {
                        saveDatabase(); refreshSystemUI(); renderAdminImageTable();
                        alert(`處理完畢！上傳 ${fileArray.length} 張圖，成功黏合 ${affectedCount} 題試題。`);
                    }
                };
                reader.readAsDataURL(file);
            });
        }
    </script>
